# Releases are made by pushing a tag, not by merging.
#
# The tag is the gate: v0.1.0 either matches the version in manifest.ini or the
# release does not happen. The build job runs the tests and packs, with a read
# only token; only the publishing job can write, and it runs on a runner that has
# seen nothing but the artifact it downloads.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Stripped on purpose: every permission a job needs is granted on that job.
permissions: {}

# A tag is pushed once. Queuing instead of cancelling keeps a half finished
# release from being overtaken by the next one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      # A tag that fails the suite does not get a release.
      - name: Run the offline suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install lupa
          python tests\run_tests.py

      # The tag and the manifest have to agree, or the archive would be published
      # under a version that is not the one it says it is.
      - name: The tag matches the manifest
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath manifest.ini -Pattern '^VERSION\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Host "tag $tag does not match manifest.ini VERSION $version" -ForegroundColor Red
            Write-Host 'Bump VERSION in manifest.ini, or tag the version that is there.' -ForegroundColor Red
            exit 1
          }
          Write-Host "tag $tag matches manifest.ini"

      - name: Build the package
        run: cmd /c "scripts\pack.cmd"

      - name: Checksums
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          if ($zip.Name -notlike "* v${{ github.ref_name }}.zip") {
            Write-Host "built $($zip.Name), expected the version of the tag" -ForegroundColor Red
            exit 1
          }
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only write in the whole pipeline.
      contents: write
    steps:
      # gh ships with the runner: no third party action in a job that can write.
      - name: Download the package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: package
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zip=$(ls dist/*.zip)
          test -f dist/SHA256SUMS

          # --generate-notes writes the changes since the previous release tag.
          # A tag that already has a release is updated instead of failing, so a
          # rerun finishes what the first attempt started.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" dist/SHA256SUMS --clobber
            echo "updated the release of $TAG"
          else
            gh release create "$TAG" "$zip" dist/SHA256SUMS --title "$TAG" --generate-notes
            echo "released $TAG"
          fi