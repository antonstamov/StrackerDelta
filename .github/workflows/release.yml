# Releases are made by pushing a tag, not by merging.
#
# The tag is the gate: v0.1.0 either matches the version in manifest.ini or the
# release does not happen. The build job runs the tests and packs, with a read
# only token; only the publishing job can write, and it runs on a runner that has
# seen nothing but the artifact it downloads.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Stripped on purpose: every permission a job needs is granted on that job.
permissions: {}

# A tag is pushed once. Queuing instead of cancelling keeps a half finished
# release from being overtaken by the next one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build package
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # A tag that fails the suite does not get a release.
      - name: Run the offline suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install lupa
          python tests\run_tests.py

      # The tag and the manifest have to agree, or the archive would be published
      # under a version that is not the one it says it is.
      - name: The tag matches the manifest
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath manifest.ini -Pattern '^VERSION\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Host "tag $tag does not match manifest.ini VERSION $version" -ForegroundColor Red
            Write-Host 'Bump VERSION in manifest.ini, or tag the version that is there.' -ForegroundColor Red
            exit 1
          }
          Write-Host "tag $tag matches manifest.ini"

      - name: Build the package
        run: cmd /c "scripts\pack.cmd"

      - name: Checksums
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip | Select-Object -First 1
          if (-not $zip) { throw "pack.cmd reported success but wrote nothing" }

          # github.ref_name of tag v0.1.0 is v0.1.0, the v is already in it.
          if ($zip.Name -notlike "* ${{ github.ref_name }}.zip") {
            Write-Host "built $($zip.Name), expected the version of the tag" -ForegroundColor Red
            exit 1
          }
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii

      # The release page shows what this version changed, written by hand in
      # CHANGELOG.md. It is cut out here, in the job that has the sources, so that
      # the job that can write to the repository never sees them. A tag with no
      # section is an error rather than a release with nothing to read: the notes
      # are written before the tag, and the tag is what asks for them.
      - name: Release notes from the changelog
        shell: pwsh
        run: |
          $version = (Select-String -LiteralPath manifest.ini -Pattern '^VERSION\s*=\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $lines = Get-Content -LiteralPath CHANGELOG.md
          $header = "## [$version]"

          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i].StartsWith($header)) { $start = $i + 1; break }
          }
          if ($start -lt 0) {
            Write-Host "CHANGELOG.md has no section $header" -ForegroundColor Red
            Write-Host 'Write what changed in this version before tagging it.' -ForegroundColor Red
            exit 1
          }

          $section = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+\[') { break }
            $section += $lines[$i]
          }
          $body = ($section -join "`n").Trim()
          if (-not $body) {
            Write-Host "the section $header is empty" -ForegroundColor Red
            exit 1
          }

          $body | Set-Content -LiteralPath dist\release-notes.md -Encoding utf8
          Write-Host "release notes for $version, $($section.Count) lines"
          Write-Host $body

      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: |
            dist/*.zip
            dist/SHA256SUMS
            dist/release-notes.md
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # The only write in the whole pipeline.
      contents: write
    steps:
      # gh ships with the runner: no third party action in a job that can write.
      - name: Download the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l dist

          # The body of the release is three parts: how to install, what this
          # version changed, and a link to everything between the tags. The middle
          # one was cut out of CHANGELOG.md by the build job - the job that can
          # write to the repository never sees the sources, only the file the other
          # job prepared. The file name is written from the tag, so it cannot rot.
          {
            echo "## Installing this release"
            echo
            echo "1. Download the asset named \`Stracker Delta ${TAG}.zip\` from the"
            echo "   **Assets** list at the bottom of this page."
            echo "2. Drag that archive into the Content Manager window. It unpacks and"
            echo "   installs itself; afterwards there must be"
            echo "   \`apps/lua/StrackerDelta/StrackerDelta.lua\`."
            echo "3. Enable **Stracker Delta** in Content Manager -> *Custom* -> *Apps*."
            echo
            echo "The address of your stracker server is set in the app, see the README."
            echo
            echo "## In this version"
            echo
            cat dist/release-notes.md
            echo
            previous=$(gh release list --repo "$REPO" --limit 100 --json tagName \
              --jq ".[] | .tagName" | grep -Fxv "$TAG" | head -n 1)
            if [ -n "$previous" ]; then
              echo "**Full Changelog**: https://github.com/$REPO/compare/$previous...$TAG"
            fi
          } > notes.md
          cat notes.md

          # This job has no checkout on purpose: the token that can write should not
          # sit next to a copy of the source. gh cannot guess the repository without
          # a git remote, so it is told which one to talk to.
          #
          # set +e: the point is to capture what gh says, not to abort on it.
          set +e
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            out=$(gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --repo "$REPO" --clobber 2>&1)
          else
            out=$(gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
              --repo "$REPO" \
              --title "$TAG" \
              --notes-file notes.md 2>&1)
          fi
          status=$?

          if [ $status -ne 0 ]; then
            # a workflow annotation is readable without signing in, the log is not
            echo "::error title=gh release failed (exit $status)::$out"
          else
            echo "$out"
          fi
          exit $status